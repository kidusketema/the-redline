<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  .card{width:1280px;height:400px;box-sizing:border-box;border-radius:36px;background:#fdfcf8;border:3px solid #0f2c57;display:flex;align-items:center;gap:60px;padding:0 84px;overflow:hidden}
  .card img{width:280px;height:280px;flex:none}
  h1{margin:0;font:400 112px/0.95 'Luckiest Guy',sans-serif;color:#0f2c57;letter-spacing:2px}
  h1 .red{position:relative;display:inline-block}
  h1 svg{position:absolute;left:-6px;bottom:-26px;width:calc(100% + 16px);height:36px}
  p{margin:44px 0 0;font:500 30px/1.35 Inter,system-ui,sans-serif;color:#4a5568}
  p b{color:#0f2c57;font-weight:600}
</style></head>
<body>
<div class="card">
  <img src="logo.png" alt="">
  <div>
    <h1>The <span class="red">Redline<svg viewBox="0 0 400 36" preserveAspectRatio="none"><path d="M6 24 C 70 14, 150 10, 230 13 S 360 20, 394 12" fill="none" stroke="#e01b2c" stroke-width="9" stroke-linecap="round"/></svg></span></h1>
    <p><b>Your agent writes it. You mark it up.</b><br>It reads every comment, pen mark and approval.</p>
  </div>
</div>
</body></html>
